version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: mcp-file-tools
    main: ./cmd/mcp-file-tools
    binary: mcp-file-tools
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Embed the fork version in both the command and server package.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/zoster81/mcp-file-tools/filetoolsserver.Version={{.Version}}

archives:
  - id: default
    ids:
      - mcp-file-tools
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - TOOLS.md
      - CHANGELOG.md
      - LICENSE
      - examples/start-openai-tunnel.ps1
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Also publish raw binaries for MCP registry (GoReleaser adds .exe automatically for Windows)
  - id: binaries
    ids:
      - mcp-file-tools
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: zoster81
    name: mcp-file-tools

# MCP Registry publication is handled by publish-registry.yml after the release
# workflow verifies checksums and generates the release-specific server.json.
