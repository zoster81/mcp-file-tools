name: Publish fork MCP Registry metadata

on:
  workflow_call:
    inputs:
      version:
        description: 'Fork release tag to publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork release tag to publish (for example, v1.7.4)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'zoster81/mcp-file-tools'
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.0
      MCP_PUBLISHER_LINUX_AMD64_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download fork release checksums
        run: |
          set -euo pipefail
          curl -fSL "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Generate verified fork registry manifest
        run: |
          set -euo pipefail
          node scripts/generate-server-json.js "${VERSION_TAG}" checksums.txt server.json
          cat server.json

      - name: Download verified mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            -o "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_LINUX_AMD64_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
