name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

  build:
    needs: verify-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: mcp-file-tools_linux_amd64
          - goos: linux
            goarch: arm64
            filename: mcp-file-tools_linux_arm64
          - goos: windows
            goarch: amd64
            filename: mcp-file-tools_windows_amd64.exe
          - goos: windows
            goarch: arm64
            filename: mcp-file-tools_windows_arm64.exe
          - goos: darwin
            goarch: amd64
            filename: mcp-file-tools_darwin_amd64
          - goos: darwin
            goarch: arm64
            filename: mcp-file-tools_darwin_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          OUTPUT: dist/${{ matrix.filename }}
        run: |
          mkdir -p dist
          version="ci-${GITHUB_SHA::12}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X github.com/zoster81/mcp-file-tools/filetoolsserver.Version=${version}" \
            -o "${OUTPUT}" \
            ./cmd/mcp-file-tools

      - name: Upload target
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7
